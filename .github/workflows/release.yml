name: Build and release
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        shell: pwsh
        run: |
          dotnet test IPFamilySwitcher.Tests/IPFamilySwitcher.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Package version from version.json
        shell: pwsh
        run: ./scripts/publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            IPFamilySwitcher-Portable-x64-v*.zip
            IPFamilySwitcher-Portable-x64-v*.zip.sha256
            release-notes.md
            version.json
  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
      - name: Publish once per version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version version.json)
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Increase version.json for a new release."
            exit 0
          fi
          gh release create "$tag" IPFamilySwitcher-Portable-x64-v*.zip IPFamilySwitcher-Portable-x64-v*.zip.sha256 --target "$TARGET_COMMIT" --title "IP Family Switcher $tag" --notes-file release-notes.md
